# ARCoS Package Manager - static configuration.
#
# Nothing here is generated. config/packages.yaml is generated by `discover`
# and config/overrides.yaml holds hand-verified upstream mappings.
version: 1

# Where the package list comes from. arrcus_rel keeps a SEPARATE manifest branch
# per Debian release, and they genuinely differ: the trixie manifest drops eight
# packages and moves fourteen onto aminor-trixie. Reading one manifest and
# assuming it covers both releases produces wrong branches and invents packages
# that do not ship.
manifest:
  repository: ssh://git@github.com/Arrcus/arrcus_rel.git
  file: .gitmodules
  branches:
    bookworm: aminor
    trixie: aminor-trixie

# Submodules of arrcus_rel that are NOT shippable packages.
# .gitmodules lists 53 submodules; excluding these leaves the real package set.
excluded_submodules:
  - arrcus_docs        # documentation, not a package

# Debian releases the tool resolves against.
releases:
  - id: bookworm
    suite: oldstable
    version: "12"
  - id: trixie
    suite: stable
    version: "13"

# Debian archive layout. Suites are tried in order; the first stanza found for a
# source package wins, so security/updates override the base suite.
archive:
  mirror: http://deb.debian.org/debian
  security_mirror: http://security.debian.org/debian-security
  components: [main]
  # {release} is substituted per release.
  suites:
    - "{release}"
    - "{release}-updates"
  security_suites:
    - "{release}-security"

# Hosts that publish Debian PACKAGING repositories. A URL on one of these is the
# Debian packaging history, never the project's own upstream, so it is recorded
# in the Vcs-Git column and rejected as an upstream candidate.
packaging_hosts:
  - salsa.debian.org
  - git.debian.org
  - alioth.debian.org
  - anonscm.debian.org

# Hosts whose URLs can be normalised into a cloneable git repository.
forge_hosts:
  - github.com
  - gitlab.com
  - salsa.debian.org
  - codeberg.org
  - git.sr.ht
  - bitbucket.org

# Packages with no Debian source package are classified by these patterns.
# 'vendor' = third-party silicon/NIC vendor drops. 'arrcus_native' = first-party.
classification:
  vendor_patterns:
    - "^bcmsdk$"
    - "^mlnx-"
    - "^intel-"
    - "^confd$"
  # Everything else without a Debian source package falls back to arrcus_native.

# The kernel is versioned by stable series, not by a Debian source version, so it
# resolves through a dedicated strategy. The series is DERIVED from the Debian
# linux version (6.1.176-1 -> linux-6.1.y); these are the expected values, used
# only to cross-check the derivation and catch a release/branch mis-pairing.
kernel:
  package: linux
  upstream_repository: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
  expected_series:
    bookworm: linux-6.1.y
    trixie: linux-6.12.y

# Ancestry verification. Metadata says where a package probably comes from; only
# shared git history proves it. ARCoS forked the Debian PACKAGING repository for
# several packages and the projects' own repository for others, and nothing in
# the metadata distinguishes the two cases - it has to be measured.
ancestry:
  enabled: true
  # Development refs of a Debian packaging repository. Tried only AFTER the
  # release's own packaging tag (debian/<version>) and branch (debian/<codename>):
  # debian/sid is what Debian is preparing next, not what the release ships.
  packaging_refs:
    - debian/sid
    - debian/master
    - debian/latest
    - master
  # Packages never probed. A skipped package cannot be VERIFIED: it reports
  # NEEDS_REVIEW / ANCESTRY_NOT_PROBED. Empty: the probe fetches the commit
  # graph only (tree:0) into a persistent workdir, so even the kernel is
  # affordable after its first run.
  skip: []
  # Probe only the project's own repository for these, not the Debian
  # packaging repository (the kernel's packaging repository is huge and is not
  # what ARCoS forked).
  primary_only:
    - linux
  # When a curated repository shares no history and another candidate does,
  # the row is NEEDS_REVIEW / CURATED_CONFLICT. Set true (here, or per package
  # as allow_ancestry_replacement in overrides.yaml) to let history replace it.
  allow_curated_replacement: false
  # Probe results are keyed by the ARCoS commit and every candidate's commit;
  # this TTL is a backstop for keys with an unknown commit.
  cache_ttl_seconds: 604800
  max_candidates: 12

# Suspicious results are flagged for review, never rejected.
plausibility:
  behind_warning: 1000
  arcos_only_warning: 1000
  merge_base_age_years: 4

# Content-based base detection for forks that share no git history.
content_base:
  enabled: true
  max_tags: 150
  # Below this tree-similarity score no release is proposed as the base.
  min_score: 0.6

comparison:
  # Upstream commits checked with git apply / line comparison per comparison;
  # beyond this they are UNKNOWN, never assumed missing.
  content_check_limit: 1000

# External security evidence. Debian's own patches and changelog are always
# read; OSV.dev is queried for vulnerabilities affecting the upstream base.
security:
  osv:
    enabled: true
    api_url: https://api.osv.dev/v1
    timeout_seconds: 20
    cache_ttl_seconds: 86400

# Repositories that require the configured access bridge rather than direct
# access from the machine running this tool. Regular expressions, matched against
# the repository URL. Overridden by APM_PRIVATE_REPOSITORY_PATTERNS, so a
# deployment with direct access can clear it without editing this file.
private_repository_patterns:
  - "github\\.com[:/]+arrcus/"

# apm publish-upstream-md: proposing debian/upstream.md to each package.
upstream_md_publish:
  # Every branch this workflow creates lives under upstream-metadata/; the
  # publisher refuses any other name, and any name equal to the target branch.
  branch_template: "upstream-metadata/{release}/{package}"
  # Packages never proposed, with the reason recorded in the results ledger.
  exclude:
    ONL-standalone: >-
      Arrcus/onl-testbed has no debian/ directory; where the file belongs is
      awaiting a decision
    ONL-xc: >-
      Arrcus/onl-testbed has no debian/ directory; where the file belongs is
      awaiting a decision
  # Large repositories, processed after everything else.
  defer:
    - openssl
    - linux
