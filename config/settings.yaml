# ARCoS Package Manager - static configuration.
#
# Nothing here is generated. config/packages.yaml is generated by `discover`
# and config/overrides.yaml holds hand-verified upstream mappings.
version: 1

# Where the package list comes from. arrcus_rel keeps a SEPARATE manifest branch
# per Debian release, and they genuinely differ: the trixie manifest drops eight
# packages and moves fourteen onto aminor-trixie. Reading one manifest and
# assuming it covers both releases produces wrong branches and invents packages
# that do not ship.
manifest:
  repository: ssh://git@github.com/Arrcus/arrcus_rel.git
  file: .gitmodules
  branches:
    bookworm: aminor
    trixie: aminor-trixie

# Submodules of arrcus_rel that are NOT shippable packages.
# .gitmodules lists 53 submodules; excluding these leaves the real package set.
excluded_submodules:
  - arrcus_docs        # documentation, not a package

# Debian releases the tool resolves against.
releases:
  - id: bookworm
    suite: oldstable
    version: "12"
  - id: trixie
    suite: stable
    version: "13"

# Debian archive layout. Suites are tried in order; the first stanza found for a
# source package wins, so security/updates override the base suite.
archive:
  mirror: http://deb.debian.org/debian
  security_mirror: http://security.debian.org/debian-security
  components: [main]
  # {release} is substituted per release.
  suites:
    - "{release}"
    - "{release}-updates"
  security_suites:
    - "{release}-security"

# Hosts that publish Debian PACKAGING repositories. A URL on one of these is the
# Debian packaging history, never the project's own upstream, so it is recorded
# in the Vcs-Git column and rejected as an upstream candidate.
packaging_hosts:
  - salsa.debian.org
  - git.debian.org
  - alioth.debian.org
  - anonscm.debian.org

# Hosts whose URLs can be normalised into a cloneable git repository.
forge_hosts:
  - github.com
  - gitlab.com
  - salsa.debian.org
  - codeberg.org
  - git.sr.ht
  - bitbucket.org

# Packages with no Debian source package are classified by these patterns.
# 'vendor' = third-party silicon/NIC vendor drops. 'arrcus_native' = first-party.
classification:
  vendor_patterns:
    - "^bcmsdk$"
    - "^mlnx-"
    - "^intel-"
    - "^confd$"
  # Everything else without a Debian source package falls back to arrcus_native.

# The kernel is versioned by stable series, not by a Debian source version, so it
# resolves through a dedicated strategy. The series is DERIVED from the Debian
# linux version (6.1.176-1 -> linux-6.1.y); these are the expected values, used
# only to cross-check the derivation and catch a release/branch mis-pairing.
kernel:
  package: linux
  upstream_repository: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
  expected_series:
    bookworm: linux-6.1.y
    trixie: linux-6.12.y

# Ancestry verification. Metadata says where a package probably comes from; only
# shared git history proves it. ARCoS forked the Debian PACKAGING repository for
# several packages and the projects' own repository for others, and nothing in
# the metadata distinguishes the two cases - it has to be measured.
ancestry:
  enabled: true
  # Refs to try on a Debian packaging repository when testing it as the origin.
  packaging_refs:
    - debian/sid
    - debian/master
    - master
  # Repositories too large to clone for a merge-base. The kernel's series pairing
  # is already derived from the Debian version and cross-checked, so it needs no
  # ancestry probe.
  skip:
    - linux

# Repositories that require the configured access bridge rather than direct
# access from the machine running this tool. Regular expressions, matched against
# the repository URL. Overridden by APM_PRIVATE_REPOSITORY_PATTERNS, so a
# deployment with direct access can clear it without editing this file.
private_repository_patterns:
  - "github\\.com[:/]+arrcus/"
