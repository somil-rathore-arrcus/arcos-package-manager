# ARCoS Package Manager - the standard way to run it.
#
#   cp .env.example .env      # set APM_UID/APM_GID, the SSH key path, the token
#   docker compose up -d --build
#   open http://<server-ip>:8080/
#
# One container: FastAPI/uvicorn serves the API at /api and the built dashboard
# at /, on port 8080. Configuration comes from .env; nothing secret or
# machine-specific is in the image.
name: arcos-package-manager

services:
  app:
    build:
      context: .
      target: runtime
      args:
        # The container user. Make these the owner of the host directories
        # mounted below and of the SSH key (id -u / id -g on the host).
        APP_UID: ${APM_UID:-1000}
        APP_GID: ${APM_GID:-1000}
    image: arcos-package-manager:latest
    env_file: [.env]
    environment:
      APM_CACHE_DIR: /var/cache/arcos-package-manager
      APM_WORKSPACE_DIR: /var/tmp/arcos-package-manager
      # Generated runtime state lives in out/ - never in the read-only config/.
      APM_PACKAGES_FILE: /app/out/packages.yaml
      APM_APPROVALS_FILE: /app/out/approvals.yaml
      # .env names files on the HOST; inside the container they are where the
      # volumes below mount them. Empty when the host file is not configured.
      APM_GIT_SSH_IDENTITY_FILE: ${APM_GIT_SSH_KEY_FILE:+/home/apm/.ssh/id_git}
      APM_GIT_KNOWN_HOSTS_FILE: ${APM_SSH_KNOWN_HOSTS_FILE:+/home/apm/.ssh/known_hosts}
      APM_SSH_IDENTITY_FILE: ${APM_SSH_IDENTITY_FILE:+/home/apm/.ssh/id_bridge}
      APM_SSH_KNOWN_HOSTS: ${APM_SSH_KNOWN_HOSTS_FILE:+/home/apm/.ssh/known_hosts}
    ports:
      # Browsers reach the server only here. APM_BIND_ADDRESS=127.0.0.1 keeps
      # it local to the host.
      - "${APM_BIND_ADDRESS:-0.0.0.0}:${APM_PORT:-8080}:8080"
    volumes:
      # Shipped configuration: read-only. Editing overrides.yaml on the host
      # takes effect on restart, without a rebuild.
      - ./config:/app/config:ro
      # Everything the application generates: mapping, reports, upstream.md
      # files, PR plans and ledgers, comparison snapshots, approvals and the
      # runtime packages.yaml. Survives rebuilds and recreation.
      - ${APM_OUT_HOST_DIR:-./out}:/app/out
      # Git clones and probe workdirs - large, reused across runs.
      - ${APM_WORKSPACE_HOST_DIR:-./workspace}:/var/tmp/arcos-package-manager
      # Downloaded Debian/OSV data and the ancestry cache: regenerable.
      - ${APM_CACHE_HOST_DIR:-apm-cache}:/var/cache/arcos-package-manager
      # SSH credentials, read-only, from paths set in .env. /dev/null when
      # unset, so the stack starts without them.
      #   id_git     git's own key for the repositories (APM_GIT_BACKEND=local)
      #   id_bridge  only for an SSH bridge host (APM_GIT_BACKEND=auto|ssh)
      - ${APM_GIT_SSH_KEY_FILE:-/dev/null}:/home/apm/.ssh/id_git:ro
      - ${APM_SSH_KNOWN_HOSTS_FILE:-/dev/null}:/home/apm/.ssh/known_hosts:ro
      - ${APM_SSH_IDENTITY_FILE:-/dev/null}:/home/apm/.ssh/id_bridge:ro
    # The image is immutable at runtime: only the mounts above and /tmp are
    # writable.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # A minimal init as PID 1: forwards SIGTERM to uvicorn and reaps the git
    # processes the application starts.
    init: true
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  apm-cache:
